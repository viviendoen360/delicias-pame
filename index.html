<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delicias Pame - Pedidos</title>
    
    <!-- Estilos rápidos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y ReactDOM (Versión estable) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        body { font-family: 'Quicksand', sans-serif; background-color: #FFF8E1; }
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Ocultar barra scroll */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. ÍCONOS INTEGRADOS (Para evitar pantalla blanca) ---
        const Icons = {
            menu: <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>,
            cart: <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 20a1 1 0 100 2 1 1 0 000-2zm7 0a1 1 0 100 2 1 1 0 000-2zm-7-4h7a2 2 0 002-2V9a2 2 0 00-2-2h-3m-6 0H4L2 5h18"/></svg>,
            settings: <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 00-2 2v.18a2 2 0 01-1 1.73l-.43.25a2 2 0 01-2 0l-.18-.08a2 2 0 00-2 2v.44a2 2 0 002 2h.18a2 2 0 011.73 1l.25.43a2 2 0 010 2l-.08.18a2 2 0 002 2h.44a2 2 0 002-2v-.18a2 2 0 011-1.73l.43-.25a2 2 0 012 0l.18.08a2 2 0 002-2v-.44a2 2 0 00-2-2h-.18a2 2 0 01-1.73-1l-.25-.43a2 2 0 010-2l.08-.18a2 2 0 00-2-2zM12 9a3 3 0 100 6 3 3 0 000-6z"/></svg>,
            plus: <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>,
            minus: <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>,
            trash: <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>,
            check: <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>,
            whatsapp: <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg>,
            credit: <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>,
            user: <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            logout: <svg width="24" height="24" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        };

        const Icon = ({ name, size = 20, className = "" }) => {
            const Svg = Icons[name];
            if (!Svg) return null;
            return React.cloneElement(Svg, { width: size, height: size, className });
        };

        // --- 2. CONFIGURACIÓN E INICIALIZACIÓN ---
        const { useState, useEffect } = React;

        // Firebase Init con manejo de errores
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'delicias-pame-v2';
        
        let db, auth;
        try {
            if (firebase.apps.length === 0) firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            auth = firebase.auth();
        } catch (e) {
            console.error("Error inicializando Firebase:", e);
        }

        // DATOS BANCARIOS PRE-CARGADOS
        const DEFAULT_CONFIG = {
            adminPhone: '593985149118',
            accounts: [
                { bank: 'Banco Guayaquil', type: 'Ahorro', number: '48517515', owner: 'Jacqueline Romero', id: '0909527749' },
                { bank: 'Banco Pichincha', type: 'Ahorro', number: '2209496497', owner: 'Jacqueline Romero', id: '0909527749' },
                { bank: 'Banco Pacífico', type: 'Cte', number: '7517440', owner: 'Pamela Cavagnaro', id: '0926584426' }
            ]
        };

        // --- 3. COMPONENTE APP ---
        function App() {
            const [view, setView] = useState('menu');
            const [cart, setCart] = useState([]);
            const [user, setUser] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);

            // Login anónimo automático
            useEffect(() => {
                if(!auth) return;
                const doLogin = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await auth.signInWithCustomToken(__initial_auth_token);
                    } else {
                        await auth.signInAnonymously();
                    }
                };
                doLogin();
                auth.onAuthStateChanged(u => setUser(u));
            }, []);

            // Lógica del Carrito
            const addToCart = (item) => {
                setCart(prev => {
                    const exist = prev.find(i => i.id === item.id);
                    if(exist) return prev.map(i => i.id === item.id ? {...i, qty: i.qty+1} : i);
                    return [...prev, {...item, qty:1}];
                });
            };
            const updateQty = (id, delta) => setCart(prev => prev.map(i => i.id === id ? {...i, qty: Math.max(1, i.qty+delta)} : i));
            const remove = (id) => setCart(prev => prev.filter(i => i.id !== id));
            const clear = () => setCart([]);

            const renderView = () => {
                switch(view) {
                    case 'menu': return <Menu user={user} addToCart={addToCart} />;
                    case 'cart': return <Cart user={user} cart={cart} updateQty={updateQty} remove={remove} clear={clear} setView={setView} />;
                    case 'admin': return <AdminLogin onLogin={() => {setIsAdmin(true); setView('dashboard');}} setView={setView} />;
                    case 'dashboard': return isAdmin ? <AdminDashboard user={user} setView={setView} /> : <AdminLogin onLogin={() => {setIsAdmin(true); setView('dashboard');}} setView={setView} />;
                    default: return <Menu user={user} addToCart={addToCart} />;
                }
            };

            return (
                <div className="max-w-md mx-auto min-h-screen bg-orange-50 shadow-2xl flex flex-col relative">
                    {/* Header */}
                    <div className="bg-orange-500 text-white p-4 sticky top-0 z-50 flex justify-between items-center shadow-md rounded-b-xl">
                        <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('menu')}>
                            <div className="bg-white text-orange-600 w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg shadow">DP</div>
                            <div>
                                <h1 className="font-bold text-lg leading-none">Delicias Pame</h1>
                                <span className="text-xs opacity-90">Sabor Casero</span>
                            </div>
                        </div>
                        <div className="flex gap-3">
                            {view === 'menu' && (
                                <button onClick={() => setView('admin')} className="p-2 hover:bg-orange-600 rounded-full">
                                    <Icon name="settings" />
                                </button>
                            )}
                            <button onClick={() => setView('cart')} className="relative p-2 hover:bg-orange-600 rounded-full">
                                <Icon name="cart" size={24} />
                                {cart.length > 0 && (
                                    <span className="absolute -top-1 -right-1 bg-red-500 text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full border-2 border-orange-500">
                                        {cart.reduce((a,b)=>a+b.qty, 0)}
                                    </span>
                                )}
                            </button>
                        </div>
                    </div>

                    {/* Main */}
                    <div className="flex-1 p-4 pb-20 overflow-y-auto">
                        {renderView()}
                    </div>
                </div>
            );
        }

        // --- 4. VISTA: MENÚ ---
        function Menu({ user, addToCart }) {
            const [items, setItems] = useState([]);
            const [cat, setCat] = useState('Todos');
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                if(!db) return;
                const unsub = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('menu')
                    .onSnapshot(snap => {
                        setItems(snap.docs.map(d => ({id:d.id, ...d.data()})));
                        setLoading(false);
                    });
                return () => unsub();
            }, []);

            const categories = ['Todos', ...new Set(items.map(i => i.category))];
            const filtered = cat === 'Todos' ? items : items.filter(i => i.category === cat);

            if(loading) return <div className="text-center mt-10 text-orange-500 font-bold animate-pulse">Cargando menú...</div>;

            return (
                <div className="fade-in">
                    <div className="flex gap-2 overflow-x-auto pb-4 no-scrollbar mb-2">
                        {categories.map(c => (
                            <button key={c} onClick={() => setCat(c)} className={`px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap transition-all ${cat === c ? 'bg-orange-500 text-white shadow' : 'bg-white text-gray-600 border border-orange-100'}`}>
                                {c}
                            </button>
                        ))}
                    </div>

                    <div className="grid gap-4">
                        {filtered.length === 0 && <div className="text-center text-gray-400 mt-10 p-6 border-2 border-dashed border-gray-200 rounded-xl">Menú vacío por ahora.</div>}
                        {filtered.map(item => (
                            <div key={item.id} className="bg-white p-3 rounded-xl shadow-sm border border-orange-50 flex gap-4 items-center">
                                <div className="text-4xl w-16 h-16 bg-orange-50 rounded-lg flex items-center justify-center shadow-inner">{item.emoji || '🥘'}</div>
                                <div className="flex-1">
                                    <h3 className="font-bold text-gray-800 leading-tight">{item.name}</h3>
                                    <p className="text-xs text-gray-500 mt-1 line-clamp-2">{item.description}</p>
                                    <div className="flex justify-between items-center mt-2">
                                        <span className="font-bold text-orange-600 text-lg">${parseFloat(item.price).toFixed(2)}</span>
                                        <button onClick={() => addToCart(item)} className="bg-orange-100 text-orange-600 p-2 rounded-full hover:bg-orange-500 hover:text-white transition-colors">
                                            <Icon name="plus" size={18} />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        }

        // --- 5. VISTA: CARRITO ---
        function Cart({ user, cart, updateQty, remove, clear, setView }) {
            const [step, setStep] = useState(1);
            const [form, setForm] = useState({ name: '', phone: '', obs: '' });
            const [config, setConfig] = useState(DEFAULT_CONFIG);

            useEffect(() => {
                if(!db) return;
                // Intentar cargar config, si falla usar DEFAULT
                db.doc(`artifacts/${appId}/public/data/settings/config`).get().then(snap => {
                    if(snap.exists && snap.data().accounts) setConfig(snap.data());
                });
            }, []);

            const total = cart.reduce((acc, item) => acc + (item.price * item.qty), 0);

            const sendOrder = async () => {
                if(!form.name || !form.phone) return alert("Por favor ingresa nombre y celular");

                // Guardar en Firestore
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('orders').add({
                        items: cart, customer: form, total, status: 'Pendiente',
                        createdAt: new Date().toISOString(), timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch(e) { console.error(e); }

                // Generar mensaje WA
                const itemsList = cart.map(i => `• ${i.qty}x ${i.name}`).join('%0A');
                // Lista de cuentas breve para el mensaje
                const banksShort = config.accounts.map(a => `${a.bank} (${a.number})`).join('%0A');
                
                const msg = `Hola! 👋%0ASoy *${form.name}*. Quiero ordenar:%0A%0A${itemsList}%0A%0ATotal: *$${total.toFixed(2)}*%0AObs: ${form.obs}`;
                window.open(`https://wa.me/${config.adminPhone}?text=${msg}`, '_blank');
                
                clear();
                setStep(3);
            };

            if(cart.length === 0 && step !== 3) return (
                <div className="text-center mt-20 text-gray-400 px-6">
                    <div className="mx-auto w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mb-4 opacity-50"><Icon name="cart" size={40} /></div>
                    <p className="mb-4">No has agregado nada aún.</p>
                    <button onClick={() => setView('menu')} className="text-orange-500 font-bold underline">Volver al Menú</button>
                </div>
            );

            if(step === 3) return (
                <div className="text-center mt-4 fade-in px-2">
                    <div className="bg-green-100 text-green-600 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4"><Icon name="check" size={32} /></div>
                    <h2 className="text-2xl font-bold text-gray-800 mb-2">¡Pedido Enviado!</h2>
                    <p className="text-gray-600 mb-6 text-sm">Realiza tu pago a una de estas cuentas y envía el comprobante al WhatsApp:</p>
                    
                    <div className="space-y-3 mb-8 text-left">
                        {config.accounts.map((acc, idx) => (
                            <div key={idx} className="bg-white p-4 rounded-xl shadow-md border-l-4 border-orange-500 relative">
                                <div className="absolute top-0 right-0 bg-orange-100 text-orange-600 px-2 py-0.5 text-[10px] font-bold rounded-bl-lg uppercase">{acc.bank}</div>
                                <p className="font-bold text-gray-800 text-sm">{acc.owner}</p>
                                <p className="text-xs text-gray-500">CI: {acc.id}</p>
                                <div className="mt-1 bg-gray-50 p-2 rounded border border-gray-100 font-mono text-sm text-gray-700 flex justify-between">
                                    <span>{acc.number}</span>
                                    <span className="text-xs text-gray-400 uppercase">{acc.type}</span>
                                </div>
                            </div>
                        ))}
                    </div>
                    <button onClick={() => setView('menu')} className="bg-gray-800 text-white w-full py-3 rounded-xl font-bold">Volver al Inicio</button>
                </div>
            );

            return (
                <div className="fade-in">
                    <h2 className="text-xl font-bold mb-4 flex items-center gap-2">{step === 1 ? 'Resumen' : 'Datos de Envío'}</h2>
                    
                    {step === 1 ? (
                        <div className="space-y-3">
                            {cart.map(item => (
                                <div key={item.id} className="bg-white p-3 rounded-xl shadow-sm flex justify-between items-center border border-gray-100">
                                    <div>
                                        <p className="font-bold text-gray-800">{item.name}</p>
                                        <p className="text-orange-600 font-bold text-sm">${item.price}</p>
                                    </div>
                                    <div className="flex items-center gap-3 bg-gray-50 rounded-full px-2 py-1 border">
                                        <button onClick={() => updateQty(item.id, -1)} className="text-gray-500"><Icon name="minus" size={16}/></button>
                                        <span className="font-bold text-sm w-4 text-center">{item.qty}</span>
                                        <button onClick={() => updateQty(item.id, 1)} className="text-gray-500"><Icon name="plus" size={16}/></button>
                                    </div>
                                    <button onClick={() => remove(item.id)} className="text-red-400 ml-2 hover:bg-red-50 p-1 rounded"><Icon name="trash" size={18}/></button>
                                </div>
                            ))}
                            <div className="mt-6 border-t pt-4 flex justify-between text-xl font-bold text-gray-800">
                                <span>Total</span>
                                <span>${total.toFixed(2)}</span>
                            </div>
                            <button onClick={() => setStep(2)} className="w-full bg-orange-500 text-white py-3 rounded-xl font-bold shadow-lg mt-6 hover:bg-orange-600 transition">Continuar</button>
                        </div>
                    ) : (
                        <div className="bg-white p-5 rounded-xl shadow-sm space-y-4 border border-orange-100">
                            <div>
                                <label className="text-xs font-bold text-gray-500 uppercase ml-1">Tu Nombre</label>
                                <input className="w-full p-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 ring-orange-200 outline-none" value={form.name} onChange={e => setForm({...form, name: e.target.value})} placeholder="Ej. Juan Pérez" />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-gray-500 uppercase ml-1">Celular (WhatsApp)</label>
                                <input className="w-full p-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 ring-orange-200 outline-none" type="tel" value={form.phone} onChange={e => setForm({...form, phone: e.target.value})} placeholder="Ej. 099..." />
                            </div>
                            <div>
                                <label className="text-xs font-bold text-gray-500 uppercase ml-1">Observaciones</label>
                                <textarea className="w-full p-3 border rounded-lg bg-gray-50 focus:bg-white focus:ring-2 ring-orange-200 outline-none h-20" value={form.obs} onChange={e => setForm({...form, obs: e.target.value})} placeholder="Sin cebolla, aderezo aparte..."></textarea>
                            </div>
                            <div className="flex gap-2 pt-2">
                                <button onClick={() => setStep(1)} className="flex-1 py-3 bg-gray-200 rounded-xl font-bold text-gray-600">Atrás</button>
                                <button onClick={sendOrder} className="flex-[2] py-3 bg-green-500 text-white rounded-xl font-bold shadow-lg flex justify-center items-center gap-2 hover:bg-green-600">
                                    <Icon name="whatsapp" size={20} /> Pedir
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- 6. ADMIN LOGIN ---
        function AdminLogin({ onLogin, setView }) {
            const [u, setU] = useState('');
            const [p, setP] = useState('');
            const [err, setErr] = useState('');
            const [hint, setHint] = useState(false);

            const check = (e) => {
                e.preventDefault();
                if(u.toLowerCase() === 'pamela' && p === 'delicias123') onLogin();
                else setErr('Usuario o clave incorrecta');
            };

            return (
                <div className="flex flex-col items-center justify-center h-[60vh] px-6">
                    <div className="bg-white p-8 rounded-2xl shadow-xl w-full border border-orange-100">
                        <div className="text-center mb-6">
                            <h2 className="text-2xl font-bold text-gray-800">Admin</h2>
                            <p className="text-xs text-gray-400">Acceso Privado</p>
                        </div>
                        <form onSubmit={check} className="space-y-4">
                            <input className="w-full p-3 border rounded-lg" placeholder="Usuario" value={u} onChange={e=>setU(e.target.value)} />
                            <input className="w-full p-3 border rounded-lg" type="password" placeholder="Contraseña" value={p} onChange={e=>setP(e.target.value)} />
                            {err && <p className="text-red-500 text-sm text-center font-bold">{err}</p>}
                            <button className="w-full bg-orange-600 text-white py-3 rounded-lg font-bold shadow hover:bg-orange-700">Entrar</button>
                        </form>
                        <div className="mt-4 text-center">
                            <button onClick={()=>setHint(!hint)} className="text-xs text-gray-400 underline">Olvidé contraseña</button>
                            {hint && u.toLowerCase()==='pamela' && <p className="text-xs text-orange-500 mt-1">Tu nombre + 123</p>}
                        </div>
                        <button onClick={() => setView('menu')} className="mt-6 text-gray-400 text-sm w-full">Cancelar</button>
                    </div>
                </div>
            );
        }

        // --- 7. ADMIN DASHBOARD ---
        function AdminDashboard({ user, setView }) {
            const [tab, setTab] = useState('pedidos');
            const [orders, setOrders] = useState([]);
            const [menu, setMenu] = useState([]);
            const [config, setConfig] = useState(DEFAULT_CONFIG);
            
            // Estados Formulario
            const [newItem, setNewItem] = useState({ name: '', price: '', category: 'Almuerzo', emoji: '🥘', description: '' });
            const [newAcc, setNewAcc] = useState({ bank: '', number: '', type: 'Ahorro', owner: '', id: '' });
            const [showAccForm, setShowAccForm] = useState(false);

            useEffect(() => {
                if(!db) return;
                const u1 = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('orders')
                    .orderBy('timestamp', 'desc').onSnapshot(s => setOrders(s.docs.map(d => ({id:d.id, ...d.data()}))));
                const u2 = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('menu')
                    .onSnapshot(s => setMenu(s.docs.map(d => ({id:d.id, ...d.data()}))));
                
                db.doc(`artifacts/${appId}/public/data/settings/config`).get().then(s => {
                    if(s.exists && s.data().accounts) setConfig(s.data());
                    else saveConfig(DEFAULT_CONFIG);
                });

                return () => { u1(); u2(); };
            }, []);

            const saveConfig = async (data = config) => {
                await db.doc(`artifacts/${appId}/public/data/settings/config`).set(data);
                if(data === config) alert("Configuración guardada");
            };

            // Acciones Menú
            const addDish = async () => {
                if(!newItem.name || !newItem.price) return;
                await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('menu').add({...newItem, price: parseFloat(newItem.price)});
                setNewItem({...newItem, name: '', price: ''});
            };
            const delDish = async (id) => { if(confirm("¿Eliminar?")) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('menu').doc(id).delete(); };

            // Acciones Cuentas
            const addAcc = () => {
                if(!newAcc.bank) return;
                const newC = {...config, accounts: [...config.accounts, newAcc]};
                setConfig(newC);
                saveConfig(newC);
                setNewAcc({ bank: '', number: '', type: 'Ahorro', owner: '', id: '' });
                setShowAccForm(false);
            };
            const delAcc = (idx) => {
                if(!confirm("¿Eliminar cuenta?")) return;
                const newC = {...config, accounts: config.accounts.filter((_, i) => i !== idx)};
                setConfig(newC);
                saveConfig(newC);
            };

            // Mensaje de Cobro
            const sendBill = (order) => {
                const accText = config.accounts.map(a => `🏦 ${a.bank}: ${a.number} (${a.type})`).join('%0A');
                const msg = `Hola ${order.customer.name}! 👋%0AEspero que hayas disfrutado tu pedido de *Delicias Pame*.%0A%0ATienes un valor pendiente de: *$${order.total.toFixed(2)}*.%0A%0APuedes transferir a:%0A${accText}%0A%0A¡Gracias por tu apoyo! 😊`;
                window.open(`https://wa.me/${order.customer.phone}?text=${msg}`, '_blank');
            };

            return (
                <div className="fade-in pb-10">
                    <div className="flex justify-between items-center mb-4 bg-white p-3 rounded-lg shadow-sm">
                        <div className="flex items-center gap-2">
                            <Icon name="user" className="text-orange-500" />
                            <h2 className="font-bold text-gray-800">Hola, Pamela</h2>
                        </div>
                        <button onClick={() => setView('menu')} className="text-sm text-red-400 font-bold flex items-center gap-1">
                            <Icon name="logout" size={14}/> Salir
                        </button>
                    </div>

                    <div className="flex bg-white rounded-lg p-1 mb-4 shadow-sm border border-gray-100">
                        {['pedidos', 'menu', 'config'].map(t => (
                            <button key={t} onClick={() => setTab(t)} className={`flex-1 py-2 text-sm font-bold rounded capitalize transition-all ${tab===t ? 'bg-orange-500 text-white shadow' : 'text-gray-400 hover:bg-gray-50'}`}>{t}</button>
                        ))}
                    </div>

                    {tab === 'pedidos' && (
                        <div className="space-y-3">
                            <div className="bg-orange-100 p-3 rounded-lg flex justify-between items-center border border-orange-200">
                                <span className="text-orange-800 font-bold text-sm">Total por cobrar</span>
                                <span className="text-2xl font-bold text-orange-600">${orders.reduce((a,b)=>a+b.total,0).toFixed(2)}</span>
                            </div>
                            {orders.map(o => (
                                <div key={o.id} className="bg-white p-4 rounded-xl shadow-sm border border-gray-100 relative">
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <span className="font-bold text-lg text-gray-800">{o.customer.name}</span>
                                            <p className="text-xs text-gray-400">{new Date(o.createdAt).toLocaleString()}</p>
                                        </div>
                                        <span className="font-bold text-orange-600 text-xl">${o.total.toFixed(2)}</span>
                                    </div>
                                    <div className="mt-2 text-sm text-gray-600 bg-gray-50 p-2 rounded mb-3">
                                        {o.items.map((i, idx) => <span key={idx} className="block">• {i.qty} {i.name}</span>)}
                                    </div>
                                    <button onClick={() => sendBill(o)} className="w-full bg-green-50 text-green-700 py-2 rounded-lg text-sm font-bold border border-green-200 flex items-center justify-center gap-2 hover:bg-green-100 transition">
                                        <Icon name="whatsapp" size={16} /> Enviar Cobro Bonito
                                    </button>
                                    <button onClick={async ()=>{if(confirm("¿Borrar?")) await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('orders').doc(o.id).delete()}} className="absolute top-2 right-2 text-red-300 hover:text-red-500"><Icon name="trash" size={16}/></button>
                                </div>
                            ))}
                            {orders.length === 0 && <p className="text-center text-gray-400 py-10">No hay pedidos pendientes.</p>}
                        </div>
                    )}

                    {tab === 'menu' && (
                        <div className="space-y-4">
                            <div className="bg-white p-4 rounded-xl border border-orange-200 shadow-sm">
                                <h4 className="font-bold text-sm mb-3 text-orange-600 flex items-center gap-2"><Icon name="plus" size={16}/> Agregar Plato</h4>
                                <div className="grid grid-cols-4 gap-2 mb-2">
                                    <input placeholder="Emoji" className="border p-2 rounded text-sm col-span-1 text-center" value={newItem.emoji} onChange={e=>setNewItem({...newItem, emoji: e.target.value})} />
                                    <input placeholder="Categoría" className="border p-2 rounded text-sm col-span-3" value={newItem.category} onChange={e=>setNewItem({...newItem, category: e.target.value})} />
                                </div>
                                <input placeholder="Nombre del plato" className="border p-2 rounded text-sm w-full mb-2" value={newItem.name} onChange={e=>setNewItem({...newItem, name: e.target.value})} />
                                <div className="flex gap-2">
                                    <input placeholder="Precio ($)" type="number" className="border p-2 rounded text-sm w-1/3" value={newItem.price} onChange={e=>setNewItem({...newItem, price: e.target.value})} />
                                    <button onClick={addDish} className="flex-1 bg-orange-500 text-white rounded font-bold text-sm hover:bg-orange-600">Guardar</button>
                                </div>
                            </div>
                            <div className="space-y-2">
                                {menu.map(m => (
                                    <div key={m.id} className="bg-white p-2 rounded-lg flex justify-between items-center shadow-sm border border-gray-50">
                                        <div className="flex items-center gap-3">
                                            <span className="text-2xl bg-gray-50 p-1 rounded">{m.emoji}</span>
                                            <div>
                                                <p className="font-bold text-sm text-gray-800">{m.name}</p>
                                                <p className="text-xs text-orange-500 font-bold">${m.price}</p>
                                            </div>
                                        </div>
                                        <button onClick={() => delDish(m.id)} className="text-red-400 hover:bg-red-50 p-2 rounded"><Icon name="trash" size={16} /></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {tab === 'config' && (
                        <div className="space-y-4">
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <p className="text-xs font-bold text-gray-400 uppercase mb-1">Tu WhatsApp (Sin +)</p>
                                <div className="flex gap-2">
                                    <input className="w-full border-b-2 border-orange-100 p-2 font-mono text-lg text-gray-700 focus:border-orange-500 outline-none" value={config.adminPhone} onChange={e=>setConfig({...config, adminPhone: e.target.value})} />
                                    <button onClick={() => saveConfig()} className="bg-gray-800 text-white px-4 rounded font-bold"><Icon name="check" size={18}/></button>
                                </div>
                            </div>

                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-gray-800 flex items-center gap-2"><Icon name="credit" size={18} /> Cuentas Bancarias</h3>
                                    <button onClick={() => setShowAccForm(!showAccForm)} className="bg-green-100 text-green-700 p-1 rounded hover:bg-green-200"><Icon name="plus" size={20}/></button>
                                </div>

                                {showAccForm && (
                                    <div className="bg-green-50 p-3 rounded-lg mb-4 border border-green-200 animate-fade-in">
                                        <p className="text-xs font-bold text-green-800 mb-2">Nueva Cuenta</p>
                                        <input className="w-full mb-2 p-2 rounded text-sm border" placeholder="Banco (Ej. Pichincha)" value={newAcc.bank} onChange={e=>setNewAcc({...newAcc, bank:e.target.value})} />
                                        <div className="flex gap-2 mb-2">
                                            <input className="flex-1 p-2 rounded text-sm border" placeholder="Número" value={newAcc.number} onChange={e=>setNewAcc({...newAcc, number:e.target.value})} />
                                            <select className="p-2 rounded text-sm border" value={newAcc.type} onChange={e=>setNewAcc({...newAcc, type:e.target.value})}>
                                                <option value="Ahorro">Ahorro</option>
                                                <option value="Cte">Cte</option>
                                            </select>
                                        </div>
                                        <input className="w-full mb-2 p-2 rounded text-sm border" placeholder="Titular" value={newAcc.owner} onChange={e=>setNewAcc({...newAcc, owner:e.target.value})} />
                                        <input className="w-full mb-2 p-2 rounded text-sm border" placeholder="Cédula" value={newAcc.id} onChange={e=>setNewAcc({...newAcc, id:e.target.value})} />
                                        <button onClick={addAcc} className="w-full bg-green-600 text-white py-2 rounded font-bold text-sm">Guardar</button>
                                    </div>
                                )}

                                <div className="space-y-3">
                                    {config.accounts.map((acc, idx) => (
                                        <div key={idx} className="bg-gray-50 p-3 rounded-lg border border-gray-200 relative group">
                                            <div className="flex justify-between">
                                                <span className="font-bold text-gray-800">{acc.bank}</span>
                                                <span className="text-xs bg-white border px-2 rounded-full py-0.5">{acc.type}</span>
                                            </div>
                                            <p className="font-mono text-gray-600 mt-1">{acc.number}</p>
                                            <p className="text-xs text-gray-400 mt-1">{acc.owner} - {acc.id}</p>
                                            <button onClick={() => delAcc(idx)} className="absolute top-2 right-2 text-red-300 hover:text-red-500"><Icon name="trash" size={16}/></button>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
